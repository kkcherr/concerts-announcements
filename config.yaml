# Countries whose announcements get a PRIORITY flag and are sorted to the top.
# Use ISO 3166-1 alpha-2 codes (GB = United Kingdom, ES = Spain).
priority_countries: [GB, ES]

# When the daily digest is sent, and in what timezone.
daily_run_time: "19:00"
timezone: "Europe/London"

# If true, send a "nothing new today" message even when there are no new events.
send_when_empty: false

# Toggle each source on/off.
sources:
  ticketmaster: true
  bandsintown: true

# Internal file paths (relative to the project folder).
paths:
  state_db: "data/state.db"
  ticketmaster_attraction_cache: "data/ticketmaster_attractions.json"
  bandsintown_artist_path_cache: "data/bandsintown_artist_paths.json"

# Bandsintown scraper politeness settings.
bandsintown:
  request_delay_seconds: 2.0
  max_retries: 3

# Ticketmaster API settings.
ticketmaster:
  events_page_size: 50
  request_delay_seconds: 0.25
  # Only fetch events Ticketmaster made publicly visible (i.e. announced) within
  # this many hours. The bot runs daily, so 24h plus a small buffer covers a full
  # day even if the run is a little late.
  announcement_lookback_hours: 26
